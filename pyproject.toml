[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learnm8"
version = "1.0.0"
description = "Active learning framework for large-scale molecular screening"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Antoine Lacour"},
    {name = "Maximilian Bähr"},
    {name = "Andrea Volkamer"},
]
keywords = ["active learning", "molecular screening", "cheminformatics", "drug discovery", "machine learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=1.5.0",
    # Floors chosen for bit-exact ndtr/erfc behaviour
    # and stable np.random.default_rng seed-array semantics (NEP-19).
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.0.0",
    "rdkit>=2022.03.0",
    "joblib>=1.0.0",
    "rich>=10.0.0",
    "h5py>=3.0.0",
    "hdf5plugin>=3.0.0",
    "pyyaml>=5.0.0",
    "datamol>=0.12.0",
    "matplotlib>=3.5.0",
    # Imported at load time by the learners and featurizers; floors match environment.yml.
    "torch>=2.4",
    "lightning>=2.0",
    "pytorch-lightning>=2.0",
    "xgboost>=2.0",
    "scikit-fingerprints>=2.0.0",
    "chemprop>=2.2",
    "fastprop>=1.2",
    "mordredcommunity>=2.0.0",
    # core/batching.py sizes chunks from available memory.
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
    "psutil>=5.9.0",
    "types-PyYAML",
]
gpu-gp = [
    "gpytorch>=1.11",
    "gauche>=0.1.6",
]
gpu-rapids = [
    "cuml-cu12>=25.04",
    "cupy-cuda12x>=13.0",
    "treelite>=4.6,<5.0",
]
gpu = [
    "gpytorch>=1.11",
    "gauche>=0.1.6",
    "cuml-cu12>=25.04",
    "cupy-cuda12x>=13.0",
    "treelite>=4.6,<5.0",
]

[project.scripts]
learnm8 = "learnm8.cli.main:main"

[project.urls]
Homepage = "https://github.com/drugm8/LearnM8"
Documentation = "https://drugm8.github.io/LearnM8/"
Repository = "https://github.com/drugm8/LearnM8"
Issues = "https://github.com/drugm8/LearnM8/issues"
Changelog = "https://github.com/drugm8/LearnM8/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["learnm8*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: ambiguous-unicode false positives — this codebase deliberately
# uses Greek letters (σ, β, μ, ξ, ρ) and math symbols (≥, →, ²) in scientific
# docstrings and comments; flagging them as confusable with ASCII is noise.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["learnm8"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Third-party libraries that ship no stubs / py.typed marker.
[[tool.mypy.overrides]]
module = [
    "chemprop.*",
    "cuml.*",
    "cupy.*",
    "cupyx.*",
    "datamol.*",
    "fastprop.*",
    "gauche.*",
    "gpytorch.*",
    "h5py.*",
    "joblib.*",
    "psutil.*",
    "pyarrow.*",
    "scipy.*",
    "skfp.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-warnings -ra --tb=short"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for complete workflows",
    "slow: Slow running tests (performance, large datasets)",
    "molecular: Tests requiring molecular chemistry libraries (RDKit)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
