[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnm8"
version = "0.12.0"
description = "Active Learning for Molecular Screening - Modern Architecture with Polars"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=1.5.0",
    # Floors bumped by spec 022 for bit-exact ndtr/erfc behaviour
    # and stable np.random.default_rng seed-array semantics (NEP-19).
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.0.0",
    "rdkit>=2022.03.0",
    "joblib>=1.0.0",
    "rich>=10.0.0",
    "h5py>=3.0.0",
    "hdf5plugin>=3.0.0",
    "pyyaml>=5.0.0",
    "datamol>=0.12.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
    "psutil>=5.9.0",
]
gpu-gp = [
    "gpytorch>=1.11",
    "gauche>=0.1.6",
]
gpu-rapids = [
    "cuml-cu12>=25.04",
    "cupy-cuda12x>=13.0",
    "treelite>=4.6,<5.0",
]
gpu = [
    "gpytorch>=1.11",
    "gauche>=0.1.6",
    "cuml-cu12>=25.04",
    "cupy-cuda12x>=13.0",
    "treelite>=4.6,<5.0",
]

[project.scripts]
learnm8 = "learnm8.cli.main:main"

[tool.setuptools]
packages = {find = {}}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: ambiguous-unicode false positives — this codebase deliberately
# uses Greek letters (σ, β, μ, ξ, ρ) and math symbols (≥, →, ²) in scientific
# docstrings and comments; flagging them as confusable with ASCII is noise.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["learnm8"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-warnings -ra --tb=short"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for complete workflows",
    "slow: Slow running tests (performance, large datasets)",
    "molecular: Tests requiring molecular chemistry libraries (RDKit)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]
