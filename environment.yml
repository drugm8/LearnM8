name: learnm8
channels:
  - rapidsai
  - pytorch
  - conda-forge
  - nvidia

dependencies:
  # --- Python runtime ---
  - python=3.11

  # --- Core scientific computing ---
  - numpy>=1.24,<3.0
  - scipy>=1.10,<2.0
  - pandas>=1.5,<3.0
  - polars>=1.0
  - pyarrow>=15.0

  # --- Machine learning ---
  - scikit-learn>=1.2,<1.8
  - xgboost>=1.7,<3.0
  - statsmodels>=0.14
  - joblib>=1.2

  # --- Chemistry ---
  - rdkit>=2024.03.6
  - datamol>=0.12
  - mordredcommunity

  # --- Deep learning (PyTorch + CUDA 12) ---
  - pytorch>=2.0,<3.0
  - pytorch-cuda>=12.4
  - pytorch-lightning>=2.0,<3.0

  # --- GPU acceleration (CUDA 12) ---
  - gpytorch>=1.11
  - cuml>=25.04
  - cupy
  - treelite>=4.4,<5.0

  # --- IO, display & config ---
  - h5py>=3.0
  - hdf5plugin>=3.0
  - matplotlib-base>=3.5
  - rich>=10.0
  - pyyaml>=5.0

  # --- Dev & testing ---
  - pytest>=7.0
  - ruff>=0.4
  - mypy>=1.0

  # --- Pip-only packages ---
  - pip
  - pip:
    - chemprop
    - fastprop
    - scikit-fingerprints>=1.18.0
    - gauche>=0.1.6
    - pytest-xdist>=3.5
    - git+https://github.com/mqcomplab/bitbirch.git
