<svg xmlns="http://www.w3.org/2000/svg"
     width="102.4mm" height="71.68mm" viewBox="0 0 1000 700">
  <!--
    F1 - LearnM8 architecture overview (application note, Figure 1).

    Hand-authored and kept editable; NOT produced by any script under
    publication/scripts/. This is the one figure tracked in the repository.

    Canvas is 1000x700 user units mapped to 102.4 x 71.68 mm, which is the
    slot main.tex reserves at width=0.62\linewidth (textwidth = 6.5in).
    Changing the aspect ratio reflows the paper - keep 1000:700.

    Palette is learnm8/visualization/style.py:
      PRIMARY #8352C3  PRIMARY_LIGHT #B685F6  PRIMARY_DARK #3D2160
      PRIMARY_PALE #DCCAF4  INK #252036  MUTED #62606B  GRID #E6E3EB

    Paint order matters: SVG has no z-index, so the dashed cycle container is
    declared BEFORE the arrow that enters it. Declared after, its fill would
    silently cover the arrow's final descent into Train.

    Outputs are named by what they are, not by filename; the artefact names
    belong in the text, where they can be qualified.

    Export with Inkscape to ../pdf/fig01_architecture.pdf and, at 600 dpi,
    ../png/fig01_architecture.png. The PDF export must convert text to paths
    so the figure carries no font dependency through journal production.
    (Flag spellings are omitted here: a literal double hyphen is not legal
    inside an XML comment.)
  -->

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8352C3"/>
    </marker>
    <linearGradient id="grad-lm8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B685F6"/>
      <stop offset="100%" stop-color="#8352C3"/>
    </linearGradient>

    <style>
      .box    { fill: #F8F4FD; stroke: #B685F6; stroke-width: 1.5; }
      .flow   { stroke: #8352C3; stroke-width: 2; fill: none; }
      .title  { font-family: "DejaVu Sans", Verdana, Helvetica, Arial, sans-serif;
                font-size: 24px; fill: #252036; text-anchor: middle; }
      .sub    { font-family: "DejaVu Sans", Verdana, Helvetica, Arial, sans-serif;
                font-size: 20px; fill: #62606B; text-anchor: middle; }
      .band   { font-family: "DejaVu Sans", Verdana, Helvetica, Arial, sans-serif;
                font-size: 20px; fill: #62606B; letter-spacing: 1.5px; }
      .card   { fill: #FDFBFF; stroke: #DCCAF4; stroke-width: 1.3; }
      .cardtx { font-family: "DejaVu Sans", Verdana, Helvetica, Arial, sans-serif;
                font-size: 20px; fill: #3D2160; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="#FFFFFF"/>

  <!-- ================= band 1: one-time preparation ================= -->

  <text class="band" x="36" y="40">ONCE PER LIBRARY</text>

  <!-- compounds -->
  <rect class="box" x="36" y="56" width="280" height="124" rx="10"/>
  <g transform="translate(160,67)">
    <path d="M6,23 L16,9 M16,9 L26,21" stroke="#8352C3" stroke-width="2.2"
          fill="none" stroke-linecap="round"/>
    <circle cx="6"  cy="23" r="4.5" fill="#8352C3"/>
    <circle cx="16" cy="9"  r="4.5" fill="#B685F6"/>
    <circle cx="26" cy="21" r="4.5" fill="#8352C3"/>
  </g>
  <text class="title" x="176" y="127">Compounds</text>
  <text class="sub"   x="176" y="148">SDF &#183; SMILES &#183; CSV</text>

  <line class="flow" x1="316" y1="118" x2="356" y2="118" marker-end="url(#ah)"/>

  <!-- validate -->
  <rect class="box" x="360" y="56" width="280" height="124" rx="10"/>
  <g transform="translate(484,67)">
    <circle cx="16" cy="16" r="13" fill="none" stroke="#8352C3" stroke-width="2.2"/>
    <path d="M9.5,16.5 L14,21 L23,10.5" fill="none" stroke="#8352C3"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="title" x="500" y="127">Validate</text>

  <line class="flow" x1="640" y1="118" x2="680" y2="118" marker-end="url(#ah)"/>

  <!-- featurize; the persistent cache is a property of this stage, not a
       node of its own -->
  <rect class="box" x="684" y="56" width="280" height="124" rx="10"/>
  <g transform="translate(808,67)">
    <!-- 4x4 fingerprint bit grid; filled = set bit -->
    <rect x="1.6"  y="1.6"  width="6" height="6" fill="#8352C3"/>
    <rect x="9.2"  y="1.6"  width="6" height="6" fill="#DCCAF4"/>
    <rect x="16.8" y="1.6"  width="6" height="6" fill="#8352C3"/>
    <rect x="24.4" y="1.6"  width="6" height="6" fill="#8352C3"/>
    <rect x="1.6"  y="9.2"  width="6" height="6" fill="#DCCAF4"/>
    <rect x="9.2"  y="9.2"  width="6" height="6" fill="#8352C3"/>
    <rect x="16.8" y="9.2"  width="6" height="6" fill="#DCCAF4"/>
    <rect x="24.4" y="9.2"  width="6" height="6" fill="#DCCAF4"/>
    <rect x="1.6"  y="16.8" width="6" height="6" fill="#8352C3"/>
    <rect x="9.2"  y="16.8" width="6" height="6" fill="#8352C3"/>
    <rect x="16.8" y="16.8" width="6" height="6" fill="#DCCAF4"/>
    <rect x="24.4" y="16.8" width="6" height="6" fill="#8352C3"/>
    <rect x="1.6"  y="24.4" width="6" height="6" fill="#DCCAF4"/>
    <rect x="9.2"  y="24.4" width="6" height="6" fill="#DCCAF4"/>
    <rect x="16.8" y="24.4" width="6" height="6" fill="#8352C3"/>
    <rect x="24.4" y="24.4" width="6" height="6" fill="#DCCAF4"/>
  </g>
  <text class="title" x="824" y="127">Featurize</text>
  <text class="sub"   x="824" y="148">39 featurizers</text>
  <text class="sub"   x="824" y="168">cached once in HDF5</text>

  <!-- ================= band 2: the active learning cycle ================= -->
  <!-- Declared before the incoming arrow; see the paint-order note above. -->

  <rect x="36" y="256" width="928" height="240" rx="18"
        fill="#FCFAFE" stroke="#DCCAF4" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text class="band" x="944" y="288" text-anchor="end">PER CYCLE &#183; CycleConfig</text>

  <!-- features -> the cycle -->
  <path class="flow" marker-end="url(#ah)"
        d="M824,182 L824,216 Q824,232 808,232 L205,232 Q189,232 189,248 L189,296"/>

  <!-- train -->
  <rect class="box" x="56" y="306" width="266" height="124" rx="10"/>
  <g transform="translate(173,317)">
    <path d="M5,7 L16,11 M5,7 L16,21 M5,16 L16,11 M5,16 L16,21
             M5,25 L16,11 M5,25 L16,21 M16,11 L27,16 M16,21 L27,16"
          stroke="#C4A3E8" stroke-width="1.4" fill="none"/>
    <circle cx="5"  cy="7"  r="3" fill="#B685F6"/>
    <circle cx="5"  cy="16" r="3" fill="#B685F6"/>
    <circle cx="5"  cy="25" r="3" fill="#B685F6"/>
    <circle cx="16" cy="11" r="3" fill="#B685F6"/>
    <circle cx="16" cy="21" r="3" fill="#B685F6"/>
    <circle cx="27" cy="16" r="3" fill="#8352C3"/>
  </g>
  <text class="title" x="189" y="377">Train</text>
  <text class="sub"   x="189" y="398">21 learners</text>

  <line class="flow" x1="322" y1="368" x2="362" y2="368" marker-end="url(#ah)"/>

  <!-- acquire -->
  <rect class="box" x="366" y="306" width="266" height="124" rx="10"/>
  <g transform="translate(483,317)">
    <rect x="3" y="2.5"  width="26" height="5" rx="1.5" fill="#8352C3"/>
    <rect x="3" y="10"   width="20" height="5" rx="1.5" fill="#DCCAF4"/>
    <rect x="3" y="17.5" width="15" height="5" rx="1.5" fill="#DCCAF4"/>
    <rect x="3" y="25"   width="9"  height="5" rx="1.5" fill="#DCCAF4"/>
  </g>
  <text class="title" x="499" y="377">Acquire</text>
  <text class="sub"   x="499" y="398">9 strategies</text>

  <line class="flow" x1="632" y1="368" x2="672" y2="368" marker-end="url(#ah)"/>

  <!-- oracle -->
  <rect class="box" x="676" y="306" width="266" height="124" rx="10"/>
  <g transform="translate(793,317)">
    <circle cx="16" cy="16" r="13"  fill="none" stroke="#8352C3" stroke-width="2"/>
    <circle cx="16" cy="16" r="6.5" fill="none" stroke="#B685F6" stroke-width="2"/>
    <circle cx="16" cy="16" r="2.5" fill="#8352C3"/>
  </g>
  <text class="title" x="809" y="377">Oracle</text>
  <text class="sub"   x="809" y="398">any scoring function</text>

  <!-- oracle labels -> retrain -->
  <path class="flow" marker-end="url(#ah)"
        d="M809,432 L809,456 Q809,472 793,472 L205,472 Q189,472 189,456 L189,436"/>
  <text class="sub" x="499" y="460">next cycle</text>

  <!-- ================= what a run leaves behind ================= -->

  <text class="band" x="36" y="556">OUTPUTS</text>
  <line x1="148" y1="550" x2="962" y2="550" stroke="#E6E3EB" stroke-width="1.2"/>

  <!-- final compound table -->
  <rect class="card" x="36" y="570" width="266" height="80" rx="12"/>
  <g transform="translate(155,584)">
    <rect x="1" y="3" width="26" height="22" rx="2" fill="#FFFFFF"
          stroke="#8352C3" stroke-width="1.8"/>
    <path d="M1,10 H27" stroke="#8352C3" stroke-width="1.8" fill="none"/>
    <path d="M1,17.5 H27 M11,10 V25" stroke="#DCCAF4" stroke-width="1.4" fill="none"/>
  </g>
  <text class="cardtx" x="169" y="634">Final compound table</text>

  <!-- per-cycle metrics -->
  <rect class="card" x="324" y="570" width="266" height="80" rx="12"/>
  <g transform="translate(443,584)">
    <path d="M2,25 H26 M2,25 V4" stroke="#DCCAF4" stroke-width="1.4" fill="none"/>
    <path d="M3,21 L9,15 L15,18 L21,8 L26,11" stroke="#8352C3" stroke-width="2"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="cardtx" x="457" y="634">Per-cycle metrics</text>

  <!-- per-cycle predictions -->
  <rect class="card" x="612" y="570" width="266" height="80" rx="12"/>
  <g transform="translate(731,584)">
    <rect x="2"    y="17" width="4" height="8"  rx="1" fill="#B685F6"/>
    <rect x="7.5"  y="11" width="4" height="14" rx="1" fill="#B685F6"/>
    <rect x="13"   y="5"  width="4" height="20" rx="1" fill="#8352C3"/>
    <rect x="18.5" y="12" width="4" height="13" rx="1" fill="#B685F6"/>
    <rect x="24"   y="18" width="4" height="7"  rx="1" fill="#B685F6"/>
  </g>
  <text class="cardtx" x="745" y="634">Per-cycle predictions</text>

  <!-- LearnM8 mark, bottom right. Taken from media/learnm8_favicon.svg with
       the inset-shadow filter dropped: filters rasterise on PDF export. -->
  <g transform="translate(899.538,575.538) scale(0.134615)">
    <g transform="translate(48,48) scale(0.3217)" fill="url(#grad-lm8)">
      <g transform="matrix(1,0,0,1,-57.9354,-433.689)">
        <g transform="matrix(30.0501,0,0,30.0501,-32552.7,-10072.9)">
          <path d="M1108.9,351.026L1112.42,358.568C1113.83,361.594 1116.27,364.026 1119.29,365.438L1126.83,368.958C1127.68,369.354 1128.22,370.208 1128.22,371.141C1128.22,372.078 1127.68,372.932 1126.83,373.328L1119.29,376.849C1116.27,378.26 1113.83,380.693 1112.42,383.719L1108.9,391.26C1108.51,392.109 1107.65,392.651 1106.71,392.651C1105.78,392.651 1104.93,392.109 1104.53,391.26L1101.01,383.719C1099.6,380.693 1097.17,378.26 1094.14,376.849L1086.6,373.328C1085.75,372.932 1085.21,372.078 1085.21,371.141C1085.21,370.208 1085.75,369.354 1086.6,368.958L1094.14,365.438C1097.17,364.026 1099.6,361.594 1101.01,358.568L1104.53,351.026C1104.93,350.177 1105.78,349.635 1106.71,349.635C1107.65,349.635 1108.51,350.177 1108.9,351.026Z"/>
        </g>
      </g>
    </g>
  </g>
</svg>
