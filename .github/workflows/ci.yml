name: Deploy Zensical Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Zensical build
        uses: actions/cache@v4
        with:
          key: zensical-${{ github.ref }}-${{ hashFiles('zensical.toml') }}
          path: .cache
          restore-keys: |
            zensical-${{ github.ref }}-
            zensical-

      - name: Install Zensical
        run: pip install zensical

      - name: Build docs
        run: zensical build -f zensical.toml --clean --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
