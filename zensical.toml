[project]
site_name = "LearnM8"
site_description = "Active Learning Framework for Molecular Screening"
site_author = "LearnM8 Team"
site_url = "https://volkamerlab.github.io/LearnM8"
copyright = "Copyright &copy; 2025 LearnM8 Team"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Core Concepts" = "getting-started/concepts.md" },
  ]},
  { "Tutorials" = [
    { "Running Experiments" = "tutorials/running-experiments.md" },
    { "Building Custom Cycles" = "tutorials/building-custom-cycles.md" },
    { "Benchmark vs Production" = "tutorials/benchmark-vs-production.md" },
    { "Advanced Workflows" = "tutorials/advanced-workflows.md" },
  ]},
  { "User Guide" = [
    { "CLI Reference" = "user-guide/cli-reference.md" },
    { "API Reference" = "user-guide/api-reference.md" },
    { "Examples" = "user-guide/examples.md" },
    { "Configuration Files" = "user-guide/configuration-files.md" },
  ]},
  { "Components" = [
    { "Learners" = [
      { "Overview" = "components/learners/overview.md" },
      { "Scikit-learn Models" = "components/learners/scikit-learn.md" },
      { "PyTorch Models" = "components/learners/pytorch.md" },
      { "Graph Neural Networks" = "components/learners/graph-neural-networks.md" },
      { "Ensembles" = "components/learners/ensembles.md" },
    ]},
    { "Acquisition Functions" = [
      { "Overview" = "components/acquisition/overview.md" },
      { "Basic Strategies" = "components/acquisition/basic.md" },
      { "Uncertainty-Based" = "components/acquisition/uncertainty-based.md" },
      { "Diversity Methods" = "components/acquisition/diversity.md" },
    ]},
    { "Featurizers" = [
      { "Overview" = "components/featurizers/overview.md" },
      { "Available Featurizers" = "components/featurizers/available-featurizers.md" },
    ]},
    { "Oracles" = [
      { "Overview" = "components/oracles/overview.md" },
      { "Custom Oracles" = "components/oracles/custom-oracles.md" },
    ]},
  ]},
  { "Customization" = [
    { "Custom Learners" = "customization/custom-learners.md" },
    { "Custom Acquisition" = "customization/custom-acquisition.md" },
    { "Extending Framework" = "customization/extending-framework.md" },
  ]},
]

[project.repo]
url = "https://github.com/volkamerlab/LearnM8"
name = "volkamerlab/LearnM8"
edit_uri = "edit/main/docs/"

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/volkamerlab/LearnM8"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
