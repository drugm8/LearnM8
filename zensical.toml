[project]
site_name = "LearnM8"
site_description = "Active Learning Framework for Molecular Screening"
site_author = "LearnM8 Team"
site_url = "https://drugm8.github.io/LearnM8"
copyright = "Copyright &copy; 2025 LearnM8 Team"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Core Concepts" = "getting-started/concepts.md" },
  ]},
  { "Tutorials" = [
    { "Running Experiments" = "tutorials/running-experiments.md" },
    { "Building Custom Cycles" = "tutorials/building-custom-cycles.md" },
    { "Lab Campaigns (Slow Assays)" = "tutorials/lab-campaigns.md" },
  ]},
  { "Advanced Features" = [
    { "Pruning" = "advanced/pruning.md" },
    { "Chemprop Fine-Tuning" = "advanced/chemprop-fine-tuning.md" },
    { "Configuration Files" = "advanced/configuration-files.md" },
  ]},
  { "User Guide" = [
    { "CLI Reference" = "user-guide/cli-reference.md" },
    { "API Reference" = "user-guide/api-reference.md" },
    { "Examples" = "user-guide/examples.md" },
  ]},
  { "Components" = [
    { "Learners" = [
      { "Overview" = "components/learners/overview.md" },
      { "Random Forest" = "components/learners/random-forest.md" },
      { "Gaussian Process" = "components/learners/gaussian-process.md" },
      { "XGBoost" = "components/learners/xgboost.md" },
      { "Decision Tree" = "components/learners/decision-tree.md" },
      { "Linear Regression" = "components/learners/linear-regression.md" },
      { "GPU Gaussian Process" = "components/learners/gpu-gp.md" },
      { "Sparse Variational GP" = "components/learners/svgp.md" },
      { "Random Forest (cuML FIL)" = "components/learners/rf-fil.md" },
      { "Ridge (cuML)" = "components/learners/ridge-cuml.md" },
      { "MLP" = "components/learners/mlp.md" },
      { "MC Dropout" = "components/learners/mc-dropout.md" },
      { "Fastprop" = "components/learners/fastprop.md" },
      { "Chemprop" = "components/learners/chemprop.md" },
      { "Ensembles" = "components/learners/ensembles.md" },
      { "Mixed Ensemble" = "components/learners/mixed-ensemble.md" },
      { "Chemprop Ensemble" = "components/learners/chemprop-ensemble.md" },
    ]},
    { "Acquisition Functions" = [
      { "Overview" = "components/acquisition/overview.md" },
      { "Greedy" = "components/acquisition/greedy.md" },
      { "Random" = "components/acquisition/random.md" },
      { "Top-K" = "components/acquisition/topk.md" },
      { "UCB" = "components/acquisition/ucb.md" },
      { "Expected Improvement" = "components/acquisition/expected-improvement.md" },
      { "Probability of Improvement" = "components/acquisition/probability-improvement.md" },
      { "Thompson Sampling" = "components/acquisition/thompson-sampling.md" },
      { "Entropy" = "components/acquisition/entropy.md" },
    ]},
    { "Featurizers" = [
      { "Overview" = "components/featurizers/overview.md" },
      { "Circular" = "components/featurizers/circular.md" },
      { "Key-Based" = "components/featurizers/keys.md" },
      { "Topological" = "components/featurizers/topological.md" },
      { "Hashed" = "components/featurizers/hashed.md" },
      { "Descriptors" = "components/featurizers/descriptors.md" },
      { "3D" = "components/featurizers/3d.md" },
    ]},
    { "Oracles" = [
      { "Overview" = "components/oracles/overview.md" },
      { "CSV Oracle" = "components/oracles/csv-oracle.md" },
      { "Python Oracle" = "components/oracles/python-oracle.md" },
      { "Example Oracles" = "components/oracles/example-oracles.md" },
    ]},
  ]},
  { "Extending LearnM8" = "customization/extending.md" },
]

[project.repo]
url = "https://github.com/drugm8/LearnM8"
name = "drugm8/LearnM8"
edit_uri = "edit/main/docs/"

[project.theme]
logo = "assets/learnm8_logo_light.png"
favicon = "assets/favicon.svg"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Quicksand"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "purple"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/drugm8/LearnM8"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
