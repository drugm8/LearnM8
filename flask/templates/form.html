<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameter Selection</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="jumbotron mt-5">
            <h1 class="display-4">Parameter Selection</h1>
            <p class="lead">Select parameters for model configuration</p>
            <hr class="my-4">
            <form id="paramForm" action="{{ url_for('index') }}" method="post">
                <div class="form-group mb-3">
                    <label for="learner">Learner</label>
                    <select class="form-control" id="learner" name="learner">
                        <option value="cp_learner">cp_learner</option>
                        <option value="rf_learner">rf_learner</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="hyperparameter_tuning">Hyperparameter Tuning</label>
                    <select class="form-control" id="hyperparameter_tuning" name="hyperparameter_tuning">
                        <option value="True">True</option>
                        <option value="False">False</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="batch_size_percentage">Batch Size Percentage</label>
                    <select class="form-control" id="batch_size_percentage" name="batch_size_percentage">
                        <option value="1">1</option>
                        <option value="0.5">0.5</option>
                        <option value="0.1">0.1</option>
                        <option value="0.01">0.01</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="cycles">Cycles</label>
                    <select class="form-control" id="cycles" name="cycles">
                        <option value="10">10</option>
                        <option value="-1">-1 (one batch)</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="column_to_learn">Column to Learn</label>
                    <select class="form-control" id="column_to_learn" name="column_to_learn">
                        <option value="Zscore_best_scaled">Zscore_best_scaled</option>
                        <option value="ECR_avg_scaled">ECR_avg_scaled</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="do_scoring_function_list_prediction">Do Scoring Function List Prediction</label>
                    <select class="form-control" id="do_scoring_function_list_prediction" name="do_scoring_function_list_prediction">
                        <option value="False">False</option>
                        <option value="True">True</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="first_query_function">First Query Function</label>
                    <select class="form-control" id="first_query_function" name="first_query_function">
                        <option value="random_query_function">random_query_function</option>
                        <option value="cluster_query_function">cluster_query_function</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="query_function">Query Function</label>
                    <select class="form-control" id="query_function" name="query_function">
                        <option value="greedy_query_function">greedy_query_function</option>
                        <option value="random_query_function">random_query_function</option>
                    </select>
                </div>



                <button type="submit" class="btn btn-primary">Submit Parameters</button>
            </form>
        </div>
    </div>

    {% if submitted %}
        <div class="container mt-3">
            <h3>Submitted Data:</h3>
            <pre>{{ data }}</pre>
        </div>
    {% endif %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</body>
</html>
