name: learnm8-oracles
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pip
  # Core molecular handling
  - rdkit>=2023.09.1
  - numpy>=1.24.0
  - scipy>=1.10.0
  - polars>=0.20.0
  - h5py

  # Docking dependencies
  - vina  # AutoDock Vina
  - meeko  # PDBQT conversion

  # Testing
  - pytest>=7.4.0
  - pytest-cov>=4.1.0

  # Utilities
  - tqdm

  # Install via pip
  - pip:
    - cdpkit>=1.1.0  # 3D pharmacophore calculations
    - datamol  # Molecular validation utilities
